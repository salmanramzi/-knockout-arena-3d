*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0b24;font-family:system-ui,-apple-system,Arial,sans-serif;color:white;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);padding:14px 16px;display:flex;justify-content:space-between;gap:8px}.chip{border:1px solid #ffffff35;border-radius:16px;padding:9px 12px;background:#090e31b8;backdrop-filter:blur(9px);font-weight:900;font-size:13px;box-shadow:0 6px 25px #0004}.chip strong{color:#81ffdb}.progress{position:absolute;top:65px;left:16px;right:16px;height:8px;background:#09112fc7;border:1px solid #ffffff35;border-radius:30px;overflow:hidden}.progress div{height:100%;width:0;background:linear-gradient(90deg,#22e8be,#e4ff55);transition:width .16s}.controls{position:absolute;left:0;right:0;bottom:max(23px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 26px}.stick{pointer-events:auto;width:124px;height:124px;border-radius:50%;background:#07143677;border:2px solid #76cfff78;display:grid;place-items:center;position:relative;box-shadow:inset 0 0 35px #00d2ff22}.nub{height:52px;width:52px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#c5fcff,#309dea);border:3px solid #f3ffffb8;box-shadow:0 0 22px #42e1ff8a;transform:translate(0,0)}.jump{pointer-events:auto;border:2px solid #fffbcc;border-radius:50%;width:108px;height:108px;background:radial-gradient(circle at 30% 25%,#fff3b4,#ffae28 58%,#e85b27);color:#422400;font-size:16px;font-weight:1000;box-shadow:0 9px 0 #a64c19,0 0 25px #ffd54b68;touch-action:none}.jump:active{transform:translateY(5px);box-shadow:0 4px 0 #a64c19}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(#070b2380,#070b23d9);pointer-ev </style></head><body><canvas id="game" aria-label="3D obstacle arena"></canvas><div class="hud"><div class="top"><div class="chip">🏆 <span id="score">0</span> PTS</div><div class="chip">⏱ <strong id="timer">50</strong>s</div><div class="chip">❤️ <span id="hearts">♥♥♥</span></div></div><div class="progress"><div id="progress"></div></div><div id="toast"></div><div class="controls" id="controls"><div class="stick" id="stick"><div class="nub" id="nub"></div></div><button class="jump" id="jump">JUMP ↑</button></div><div class="overlay" id="overlay"><div class="panel"><div class="logo">KNOCKOUT<br><em>ARENA 3D</em></div><p class="lead" id="message">Dodge the giant spinning sweepers, jump over obstacles, and survive 50 seconds on the crumbling arena!</p><button class="play" id="play">▶ PLAY NOW</button><div class="note">📱 Drag the joystick to move · Tap JUMP to leap<br>⌨️ Arrow / WASD keys + Space on desktop<br><span class="small">Original standalone browser game · Works offline</span></div></div></div></div><script>
(()=>{'use strict';
const cv=document.getElementById('game'),cx=cv.getContext('2d',{alpha:false});let W=0,H=0,DPR=1;const UI=id=>document.getElementById(id);const overlay=UI('overlay'),playButton=UI('play'),msg=UI('message'),controls=UI('controls');function resize(){DPR=Math.min(devicePixelRatio||1,1.65);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize,{passive:true});resize();
// Perspective renderer: vertices are transformed into a camera coordinate system and sorted by depth.
const camera={x:0,y:18,z:23},target={x:0,y:0,z:0};const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z});const norm=a=>{let n=Math.hypot(a.x,a.y,a.z)||1;return{x:a.x/n,y:a.y/n,z:a.z/n}};const cross=(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x});let fwd=norm(sub(target,camera)),right=norm(cross(fwd,{x:0,y:1,z:0})),up=cross(right,fwd);function proj(p){const d=sub(p,camera),x=d.x*right.x+d.y*right.y+d.z*right.z,y=d.x*up.x+d.y*up.y+d.z*up.z,z=d.x*fwd.x+d.y*fwd.y+d.z*fwd.z;const focal=Math.min(W*1.42,H*1.35);return{x:W*.5+x*focal/z,y:H*.51-y*focal/z,z}}let polys=[];function poly(pts,color,stroke='',lw=1){let q=pts.map(proj);if(q.some(p=>p.z<.5))return;polys.push({pts:q,color,stroke,lw,depth:q.reduce((a,b)=>a+b.z,0)/q.length})}function box(x,y,z,w,h,d,colors){let a=x-w/2,b=x+w/2,c=z-d/2,e=z+d/2,bt=y,tt=y+h;const p=(x,y,z)=>({x,y,z});poly([p(a,tt,c),p(b,tt,c),p(b,tt,e),p(a,tt,e)],colors[0]);poly([p(a,bt,e),p(b,bt,e),p(b,tt,e),p(a,tt,e)],colors[1]);poly([p(b,bt,c),p(b,bt,e),p(b,tt,e),p(b,tt,c)],colors[2]);poly([p(a,bt,c),p(a,bt,e),p(a,tt,e),p(a,tt,c)],colors[3]||colors[2]);poly([p(a,bt,c),p(b,bt,c),p(b,tt,c),p(a,tt,c)],colors[4]||colors[1])}function disk(x,y,z,r,col,edges=24){let p=[];for(let j=0;j<edges;j++){let t=2*Math.PI*j/edges;p.push({x:x+Math.cos(t)*r,y,z:z+Math.sin(t)*r})}poly(p,col)}function cylinder(x,y,z,r,h,colors,steps=12){let top=[],bot=[];for(let j=0;j<steps;j++){let a=j/steps*Math.PI*2;top.push({x:x+Math.cos(a)*r,y:y+h,z:z+Math.sin(a)*r});bot.push({x:x+Math.cos(a)*r,y,z:z+Math.sin(a)*r})}poly(top,colors[0]);for(let j=0;j<steps;j++)poly([bot[j],bot[(j+1)%steps],top[(j+1)%steps],top[j]],j%2?colors[1]:colors[2])}function beam(theta,len,rad,height,cols){const ux=Math.cos(theta),uz=Math.sin(theta),vx=-uz,vz=ux,p=(u,v,y)=>({x:u*ux+v*vx,y,z:u*uz+v*vz});let l=1.05,rr=len;poly([p(l,-rad,height),p(rr,-rad,height),p(rr,rad,height),p(l,rad,height)],cols[0]);poly([p(l,rad,height-rad*1.7),p(rr,rad,height-rad*1.7),p(rr,rad,height),p(l,rad,height)],cols[1]);poly([p(rr,-rad,height-rad*1.7),p(rr,rad,height-rad*1.7),p(rr,rad,height),p(rr,-rad,height)],cols[2]);poly([p(l,-rad,height-rad*1.7),p(rr,-rad,height-rad*1.7),p(rr,-rad,height),p(l,-rad,height)],cols[2])}
let active=false,elapsed=0,score=0,lives=3,last=0,angle=0,particles=[],tiles=[],player={},bots=[],invuln=0,shake=0,fallCount=0,jumpHeld=false,keys={};let joy={x:0,y:0};const limit=50,N=7,T=2.1;const rand=(a,b)=>a+Math.random()*(b-a);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function fresh(){active=true;elapsed=0;score=0;lives=3;angle=0;invuln=0;shake=0;fallCount=0;particles=[];player={x:0,z:6,y:0,vy:0,r:.48};tiles=[];for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++)tiles.push({i,j,fall:0,touch:0,shade:(i+j)&1});bots=[];for(let k=0;k<5;k++){let a=k*Math.PI*2/5;bots.push({x:Math.cos(a)*5,z:Math.sin(a)*5,vx:rand(-2,2),vz:rand(-2,2),t:rand(.3,2),hue:k})}overlay.classList.add('hidden');controls.classList.remove('hidden');notify('SURVIVE THE ARENA!',1.8);updateHUD()}function updateHUD(){UI('score').textContent=Math.floor(score);UI('timer').textContent=Math.ceil(Math.max(0,limit-elapsed));UI('hearts').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);UI('progress').style.width=(elapsed/limit*100)+'%'}let toastTime=0;function notify(s,t=1){UI('toast').textContent=s;toastTime=t;UI('toast').style.opacity=1}function lose(reason){active=false;controls.classList.add('hidden');msg.innerHTML=reason+'<br><b style="color:#5dffe1">SCORE '+Math.floor(score)+'</b>';playButton.textContent='↻ TRY AGAIN';overlay.classList.remove('hidden')}function win(){active=false;controls.classList.add('hidden');msg.innerHTML='🏆 YOU ARE THE CHAMPION!<br><b style="color:#5dffe1">SCORE '+Math.floor(score)+'</b>';playButton.textContent='↻ PLAY AGAIN';overlay.classList.remove('hidden')}function hit(){if(invuln>0)return;lives--;invuln=1.6;shake=10;for(let i=0;i<22;i++)particles.push({x:player.x,y:player.y+1,z:player.z,vx:rand(-5,5),vy:rand(1,8),vz:rand(-5,5),ttl:rand(.35,.9)});notify('OUCH! -1 HEART',1);if(lives<=0)lose('💥 KNOCKED OUT!')}function jump(){if(active&&player.y<=.02){player.vy=9.2;player.y=.02;notify('NICE JUMP!',.48)}}playButton.addEventListener('click',fresh);UI('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space'&&!e.repeat)jump()});addEventListener('keyup',e=>keys[e.code]=false);let stick=UI('stick'),nub=UI('nub'),touchId=null;function moveStick(e){const r=stick.getBoundingClientRect(),x=(e.clientX-(r.left+r.width/2))/(r.width*.36),y=(e.clientY-(r.top+r.height/2))/(r.height*.36),n=Math.max(1,Math.hypot(x,y));joy.x=x/n;joy.y=y/n;nub.style.transform=`translate(${joy.x*34}px,${joy.y*34}px)`}stick.addEventListener('pointerdown',e=>{touchId=e.pointerId;stick.setPointerCapture(touchId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===touchId)moveStick(e)});function release(e){if(e.pointerId!==touchId)return;touchId=null;joy.x=joy.y=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
function update(dt){if(!active)return;elapsed+=dt;angle+=dt*(1.35+elapsed*.008);score+=dt*8;invuln=Math.max(0,invuln-dt);shake=Math.max(0,shake-dt*35);toastTime-=dt;if(toastTime<=0)UI('toast').style.opacity=0;let ix=joy.x+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);let iz=joy.y+(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);let m=Math.hypot(ix,iz);if(m>1){ix/=m;iz/=m}player.x+=ix*dt*6.8;player.z+=iz*dt*6.8;player.vy-=23*dt;player.y+=player.vy*dt;if(player.y<0){player.y=0;player.vy=0}if(Math.abs(player.x)>7.35||Math.abs(player.z)>7.35)hit();player.x=clamp(player.x,-7.3,7.3);player.z=clamp(player.z,-7.3,7.3);let ii=Math.round(player.x/T),jj=Math.round(player.z/T);for(let t of tiles){if(t.i===ii&&t.j===jj&&player.y<.3){t.touch+=dt;if(t.touch>.92&&t.fall===0){t.fall=.01;fallCount++}}if(t.fall>0)t.fall+=dt}let tile=tiles.find(t=>t.i===ii&&t.j===jj);if(tile&&tile.fall>.38&&player.y<.3)hit();for(let s=0;s<2;s++){let a=angle+s*Math.PI,dx=player.x,dz=player.z,along=dx*Math.cos(a)+dz*Math.sin(a),side=Math.abs(-dx*Math.sin(a)+dz*Math.cos(a));if(along>1.05&&along<8.5&&side<.62&&player.y<(s===0?1.45:2.5))hit()}for(let b of bots){b.t-=dt;if(b.t<0){b.t=rand(.7,2);b.vx=rand(-3,3);b.vz=rand(-3,3)}b.x+=b.vx*dt;b.z+=b.vz*dt;if(Math.abs(b.x)>6){b.vx*=-1;b.x=clamp(b.x,-6,6)}if(Math.abs(b.z)>6){b.vz*=-1;b.z=clamp(b.z,-6,6)}if(Math.hypot(b.x-player.x,b.z-player.z)<.85&&player.y<.8)hit()}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=18*dt;p.ttl-=dt}particles=particles.filter(p=>p.ttl>0);if(elapsed>=limit)win();updateHUD()}
function draw(){const gr=cx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#171649');gr.addColorStop(.5,'#1b245b');gr.addColorStop(1,'#090c24');cx.fillStyle=gr;cx.fillRect(0,0,W,H);cx.save();if(shake)cx.translate(rand(-shake,shake),rand(-shake,shake));let glow=cx.createRadialGradient(W*.5,H*.5,10,W*.5,H*.5,Math.max(W,H)*.75);glow.addColorStop(0,'#41c7e71c');glow.addColorStop(1,'#02072000');cx.fillStyle=glow;cx.fillRect(0,0,W,H);polys=[];
// Arena base, segmented floor tiles, and a central rotating sweeper.
box(0,-.9,0,15.8,.75,15.8,['#24c3f7','#14467b','#0e315b']);for(let t of tiles){let x=t.i*T,z=t.j*T,yy=t.fall>0?-Math.min(10,(t.fall*t.fall*12)):0;let ground=t.shade?'#37bcdb':'#45d0e8';if(t.touch>.45)ground='#ffd45c';if(t.fall>0)ground='#fc6d8e';box(x,yy,z,T-.08,.18,T-.08,[ground,'#2079a9','#166697'])}for(let n=0;n<12;n++){let a=n*Math.PI/6,r=9.1;box(Math.cos(a)*r,-2,Math.sin(a)*r,.58,rand(1,2.8),.58,['#7b4dff','#442c98','#2d1d68'])}cylinder(0,.05,0,1.35,1.1,['#fff4a1','#ffc541','#bc671c'],16);beam(angle,8.7,.37,1.52,['#ff648e','#bd2e64','#861f59']);beam(angle+Math.PI,8.7,.37,1.52,['#ff648e','#bd2e64','#861f59']);beam(angle+Math.PI*.5,8.7,.28,2.55,['#b5f7ff','#37bddc','#147a9c']);beam(angle+Math.PI*1.5,8.7,.28,2.55,['#b5f7ff','#37bddc','#147a9c']);cylinder(0,1.15,0,.48,1.9,['#fff7ba','#ffe37d','#cd811c']);for(let b of bots){disk(b.x,.22,b.z,.55,'#1a145b80');cylinder(b.x,.17,b.z,.39,.74,['#f9e8ff','#aa6afd','#713fd6'],10);box(b.x,.85,b.z,.62,.4,.58,['#f7d4ff','#e6b9ff','#c381ed']);}if(!active||invuln% .21<.13){disk(player.x,.25,player.z,.57,'#121d5888');cylinder(player.x,player.y+.23,player.z,.43,.86,['#63fff0','#15dbc1','#008d9a'],12);box(player.x,player.y+1.08,player.z,.74,.48,.66,['#fffed5','#ffe3a1','#e0a84d']);box(player.x-.17,player.y+1.42,player.z+.31,.11,.12,.09,['#192343','#192343','#192343']);box(player.x+.17,player.y+1.42,player.z+.31,.11,.12,.09,['#192343','#192343','#192343']);}for(let p of particles)box(p.x,p.y,p.z,.15,.15,.15,['#ffee5c','#ffa22c','#ef4e6a']);polys.sort((a,b)=>b.depth-a.depth);for(let p of polys){cx.beginPath();cx.moveTo(p.pts[0].x,p.pts[0].y);for(let i=1;i<p.pts.length;i++)cx.lineTo(p.pts[i].x,p.pts[i].y);cx.closePath();cx.fillStyle=p.color;cx.fill();if(p.stroke){cx.strokeStyle=p.stroke;cx.lineWidth=p.lw;cx.stroke()}}cx.restore();if(!active){cx.fillStyle='#fff7';cx.font='bold 12px system-ui';cx.textAlign='center';cx.fillText('KNOCKOUT ARENA 3D · ORIGINAL ARCADE GAME',W/2,H-14)}}
controls.classList.add('hidden');let prev=performance.now();function frame(now){let dt=Math.min(.045,(now-prev)/1000);prev=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{prev=performance.now()});})();
